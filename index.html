<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabzon Taşkın Erken Uyarı Sistemi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #e0e0e0; }
        .info-panel {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .legend span { display: inline-block; width: 15px; height: 15px; margin-right: 5px; border-radius: 50%; }
    </style>
</head>
<body>

    <div class="info-panel">
        <h2 style="margin-top: 0;">CANLI TAŞKIN İZLEME</h2>
        <div class="legend">
            <p><span style="background: green;"></span> Normal (Güvenli)</p>
            <p><span style="background: yellow;"></span> Uyarı (Dikkat)</p>
            <p><span style="background: red;"></span> Taşkın (Kritik)</p>
        </div>
        <p style="font-size: 12px; color: gray;">Sistem her 2 saniyede bir güncellenir.</p>
    </div>

    <div id="map"></div>

    <script>
        // Haritayı güvenli bir şekilde başlat
        var map = L.map('map').setView([40.85, 39.75], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);

        var geojsonLayer;
        var ilkYukleme = true;

        function getColor(risk) {
            if (risk === 2) return 'red';
            if (risk === 1) return 'yellow';
            return 'green';
        }

        function style(feature) {
            return { color: getColor(feature.properties.risk), weight: 5, opacity: 0.9 };
        }

        function dereleriYukle() {
            var url = 'dereler.geojson?t=' + new Date().getTime();

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    // DEDEKTİFLİK: Gelen koordinatları F12 konsoluna yazdır
                    if (data.features && data.features.length > 0) {
                        console.log("Dosyadaki İlk Koordinat Parçası:", data.features[0].geometry.coordinates[0]);
                    }

                    if (geojsonLayer) { map.removeLayer(geojsonLayer); }

                    geojsonLayer = L.geoJSON(data, {
                        style: style,
                        onEachFeature: function (feature, layer) {
                            var seviye = feature.properties.su_seviyesi || 0;
                            layer.bindPopup("<b>Su Seviyesi:</b> " + seviye + " cm");
                        }
                    }).addTo(map);

                    // Eğer koordinatlar doğruysa (milyonlu değilse) hata vermeden zumla
                    if (ilkYukleme && geojsonLayer) {
                        try {
                            var bounds = geojsonLayer.getBounds();
                            if (bounds.isValid()) {
                                map.fitBounds(bounds);
                                ilkYukleme = false;
                            }
                        } catch(e) {
                            console.log("Odaklanma hatası (Büyük ihtimalle EPSG sorunu):", e);
                        }
                    }
                })
                .catch(err => console.log("Hata:", err));
        }

        dereleriYukle();
        setInterval(dereleriYukle, 2000);
    </script>
</body>
</html>
